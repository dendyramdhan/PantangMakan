<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScanBite — proposal UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1712;
    --paper: #f4efe6;
    --phone: #fbf7f1;
    --line: #e4d9c8;
    --muted: #7a6d60;
    --warn: #8d2a24;
    --chip: #fff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(900px 420px at 70% -10%, #efe2cf 0%, transparent 60%),
      #ebe4d8;
    color: var(--ink);
    font-family: Outfit, sans-serif;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 24px 48px;
    display: grid;
    grid-template-columns: 1fr 390px;
    gap: 48px;
    align-items: center;
  }
  .kicker { letter-spacing: .14em; text-transform: uppercase; font-size: 12px; color: var(--muted); margin: 0 0 12px; }
  h1 { font-family: Fraunces, serif; font-size: 64px; line-height: .95; font-weight: 560; margin: 0 0 16px; }
  .lead { font-size: 18px; line-height: 1.45; max-width: 36ch; margin: 0 0 28px; }
  ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
  li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; font-size: 16px; }
  .n { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-size: 13px; }
  .phone {
    width: 390px;
    height: 780px;
    background: var(--phone);
    border-radius: 42px;
    box-shadow: 0 30px 70px rgba(60, 40, 20, .18), inset 0 0 0 1px rgba(0,0,0,.06);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .status { height: 54px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 22px 8px; font-size: 14px; font-weight: 600; }
  .screen { flex: 1; overflow: auto; padding: 8px 22px 28px; }
  h2 { font-family: Fraunces, serif; font-size: 34px; margin: 8px 0 8px; font-weight: 560; }
  .sub { color: var(--muted); margin: 0 0 18px; line-height: 1.4; }
  .group { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 16px 0 8px; }
  .chip {
    width: 100%;
    text-align: left;
    background: var(--chip);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    font: inherit;
    font-size: 17px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .chip.on { background: var(--ink); color: #fbf7f1; border-color: var(--ink); }
  .primary, .ghost {
    width: 100%;
    border-radius: 14px;
    padding: 14px 16px;
    font: inherit;
    font-size: 17px;
    cursor: pointer;
    margin-top: 8px;
  }
  .primary { background: var(--ink); color: #fbf7f1; border: 0; }
  .primary:disabled { opacity: .35; cursor: default; }
  .ghost { background: transparent; border: 1px solid var(--line); }
  .sentence { font-family: Fraunces, serif; font-size: 40px; line-height: 1.05; margin: 12px 0; font-weight: 560; }
  .meta { color: var(--muted); font-size: 14px; margin: 4px 0; }
  .ocr { color: var(--muted); font-size: 13px; white-space: pre-line; margin-top: 12px; }
  .warnbox { background: #f8e8e4; color: var(--warn); border-radius: 14px; padding: 14px; margin: 12px 0; }
  .bar { display: flex; justify-content: flex-end; }
  .linkish { background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; }
  @media (max-width: 860px) {
    .wrap { grid-template-columns: 1fr; }
    h1 { font-size: 46px; }
    .phone { margin: 0 auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <section>
    <p class="kicker" id="kicker">Membaca Notion…</p>
    <h1 id="judul">ScanBite</h1>
    <p class="lead" id="lead"></p>
    <ol id="langkah"></ol>
  </section>
  <div class="phone" id="phone">
    <div class="status"><span>09:00</span><span>Grup 5</span></div>
    <div class="screen" id="app"></div>
  </div>
</div>
<script>
const pantangan = [
  ["Alergi", "susu", "Alergi susu"],
  ["Alergi", "kacang", "Alergi kacang"],
  ["Alergi", "telur", "Alergi telur"],
  ["Alergi", "gluten", "Alergi gluten"],
  ["Pantangan", "pemanis", "Hindari pemanis"],
  ["Pantangan", "garam", "Hindari garam"],
];
const state = { screen: "onboard", picked: new Set(["susu"]), hasil: null, kameraDitolak: false };
const copy = {
  sub: "Hasil hanya dari kata yang terbaca di daftar komposisi.",
  langkah: [],
};

function judul(id) { return pantangan.find(p => p[1] === id)[2]; }

function render() {
  const app = document.getElementById("app");
  if (state.screen === "onboard") app.innerHTML = onboard();
  else app.innerHTML = scan();
  bind();
}

function onboard() {
  const groups = ["Alergi", "Pantangan"].map(g => {
    const chips = pantangan.filter(p => p[0] === g).map(p => {
      const on = state.picked.has(p[1]) ? " on" : "";
      return `<button class="chip${on}" data-id="${p[1]}">${p[2]}</button>`;
    }).join("");
    return `<div class="group">${g}</div>${chips}`;
  }).join("");
  const disabled = state.picked.size ? "" : "disabled";
  return `<h2>Pilih pantangan sebelum scan.</h2>
    <p class="sub">${copy.sub}</p>`
    ${groups}
    <button class="primary" id="mulai" ${disabled}>Mulai scan</button>`;
}

function scan() {
  const nama = [...state.picked].map(judul).join(", ");
  let body = `<p class="sub">${nama}</p>`;
  if (state.hasil) {
    const h = state.hasil;
    body += `<div class="sentence">${h.kalimat}</div>
      <p class="meta">Create ML · ${h.model}</p>
      <p class="meta">${h.sumber}</p>
      <p class="ocr">${h.ocr}</p>`;
  } else if (!state.kameraDitolak) {
    body += `<p class="sentence" style="font-size:28px">Foto daftar komposisi di belakang kemasan.</p>`;
  }
  if (state.kameraDitolak) {
    body += `<div class="warnbox">Kamera ditolak. Buka Pengaturan, izinkan kamera, lalu kembali ke sini.</div>
      <button class="ghost" id="pengaturan">Buka Pengaturan</button>`;
  }
  const lagi = state.hasil ? "Foto lagi dari galeri" : "Pilih dari galeri";
  const kedua = state.hasil ? "Contoh lagi, tanpa susu" : "Contoh tanpa susu";
  return `<div class="bar"><button class="linkish" id="ganti">Ganti pantangan</button></div>
    ${body}
    <button class="primary" id="susu">Contoh ada susu</button>
    <button class="ghost" id="teh">${kedua}</button>
    <button class="ghost" id="kamera">Tunjukkan izin kamera ditolak</button>
    <p class="meta" style="margin-top:14px">${lagi} ada di aplikasi iOS. Di proposal ini, contoh menggantikan foto.</p>`;
}

function bind() {
  document.querySelectorAll(".chip").forEach(btn => btn.onclick = () => {
    const id = btn.dataset.id;
    state.picked.has(id) ? state.picked.delete(id) : state.picked.add(id);
    render();
  });
  const mulai = document.getElementById("mulai");
  if (mulai) mulai.onclick = () => { state.screen = "scan"; state.hasil = null; render(); };
  const ganti = document.getElementById("ganti");
  if (ganti) ganti.onclick = () => { state.screen = "onboard"; render(); };
  const kamera = document.getElementById("kamera");
  if (kamera) kamera.onclick = () => { state.kameraDitolak = !state.kameraDitolak; render(); };
  const susu = document.getElementById("susu");
  if (susu) susu.onclick = () => {
    state.kameraDitolak = false;
    state.hasil = {
      kalimat: "Ada susu yang tidak boleh dikonsumsi.",
      model: "susu 66%",
      sumber: "Foundation Models",
      ocr: "KOMPOSISI\nsusu bubuk, gula,\nkakao, lemak nabati"
    };
    render();
  };
  const teh = document.getElementById("teh");
  if (teh) teh.onclick = () => {
    state.kameraDitolak = false;
    state.hasil = {
      kalimat: "Susu tidak terbaca.",
      model: "tidak 84%",
      sumber: "API Dicoding",
      ocr: "KOMPOSISI\nair, daun teh,\nbunga melati"
    };
    render();
  };
}
const demo = new URLSearchParams(location.search).get("demo");
if (demo === "hasil" || demo === "teh" || demo === "ditolak" || demo === "scan") {
  state.screen = "scan";
  state.picked = new Set(["susu"]);
}
if (demo === "hasil") {
  state.hasil = { kalimat: "Ada susu yang tidak boleh dikonsumsi.", model: "susu 66%", sumber: "Foundation Models", ocr: "KOMPOSISI\nsusu bubuk, gula,\nkakao, lemak nabati" };
}
if (demo === "teh") {
  state.hasil = { kalimat: "Susu tidak terbaca.", model: "tidak 84%", sumber: "API Dicoding", ocr: "KOMPOSISI\nair, daun teh,\nbunga melati" };
}
if (demo === "ditolak") state.kameraDitolak = true;
function isiDariNotion(page) {
  const blocks = page.blocks || [];
  const section = (name) => {
    const start = blocks.findIndex(b => b.type === "sub_header" && b.text === name);
    if (start < 0) return [];
    const out = [];
    for (const block of blocks.slice(start + 1)) {
      if (block.type === "sub_header") break;
      out.push(block);
    }
    return out;
  };
  document.getElementById("judul").textContent = page.title || "ScanBite";
  document.getElementById("kicker").textContent = "Dibaca dari Notion · halaman PantangMakan";
  const intro = blocks.find(b => b.type === "text" && b.text.startsWith("Grup 5"));
  const masalah = section("Masalah").find(b => b.type === "text");
  document.getElementById("lead").textContent = [intro && intro.text, masalah && masalah.text].filter(Boolean).join(" ");
  const layar = section("Tiga layar").filter(b => b.type === "numbered_list");
  document.getElementById("langkah").innerHTML = layar.map((b, i) =>
    `<li><span class="n">${i + 1}</span><span>${b.text}</span></li>`).join("");
  if (masalah) copy.sub = masalah.text;
  render();
}

fetch("/api/notion").then(r => r.json()).then(page => {
  if (!page.error) isiDariNotion(page);
  else document.getElementById("kicker").textContent = "Notion tidak terbaca";
}).catch(() => {
  document.getElementById("kicker").textContent = "Notion tidak terbaca";
});
render();
</script>
</body>
</html>
